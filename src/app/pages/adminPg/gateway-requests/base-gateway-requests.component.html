<div id="page_content">
  <div id="page_content_inner">

    <div class="uk-section uk-section-default">
      <div class="uk-container uk-container-large">
        <h4 class="uk-margin-bottom">Requests</h4>

        <div id="top_bar">
          <div class="md-top-bar">
            <div class="uk-width-1-3@l uk-margin-auto">
              <form class="uk-search uk-search-default uk-width-1-1@m">
                <div input placeholder="Search" type="text" [formInput]="filterForm.get('keyword')"
                     (focusout)="handleFilterChanges('keyword')">
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="uk-section uk-section-default">
      <div class="uk-container uk-container-large">
        <form [formGroup]="filterForm" class="uk-form-horizontal uk-flex">

          <div class="uk-padding-xsmall uk-padding-remove-vertical">
            <div input placeholder="Request Type" type="select" [formInput]="filterForm.get('requestType')"
                 [options]="[{value: 'PRIMARY', label: 'Primary'}, {value: 'AFFILIATED', label: 'Affiliated'}, {value: 'null', label: 'Reset'}]"
                 (valueChange)="handleFilterChanges('requestType')">
            </div>
          </div>

          <div class="uk-padding-xsmall uk-padding-remove-vertical">
            <div input placeholder="Status" type="select" [formInput]="filterForm.get('status')"
                 [options]="statusOptions" (valueChange)="handleFilterChanges('status')">
            </div>
          </div>

        </form>
      </div>
    </div>

    <div class="uk-section uk-section-default uk-margin-remove">
      <div class="uk-container uk-container-large uk-margin-remove">


        <mat-paginator *ngIf="requests" [length]="requests.total" [pageSizeOptions]="[5, 10, 25, 50]"
                       [showFirstLastButtons]="true" [pageSize]="filterForm.get('size').value"
                       [pageIndex]="filterForm.get('page').value" (page)="handlePaginationChanges($event)">
        </mat-paginator>


        <div class="uk-card uk-card-default uk-card-body">
          <app-reusable-table
             [data]="requests?.results" [showActionsColumn]="showActionsColumn" [currentCommunityId]="communityId"
            (confirmDecision)="handleDecision($event)">
          </app-reusable-table>

        </div>
      </div>
    </div>
  </div>
