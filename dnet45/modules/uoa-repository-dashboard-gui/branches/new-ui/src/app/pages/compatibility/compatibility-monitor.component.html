<div id="top_bar">
  <div class="md-top-bar">
    <div class="uk-width-large-8-10 uk-container-center">
      <ul class="top_bar_nav" id="list_grid_toggle">
        <li class="{{tilesView ? 'uk-active' : ''}}" data-view="grid_view">
          <a (click)="changeView('tiles')"><i class="fas fa-th-large"></i> Grid</a>
        </li>
        <li data-view="list_view" class="{{tilesView ? '' : 'uk-active'}}">
          <a (click)="changeView('list')"><i class="fas fa-list"></i> List</a>
        </li>
      </ul>
    </div>
  </div>
</div>

<div id="page_content">
  <div id="page_content_inner">
    <h2 class="heading_b uk-margin-bottom">Monitor</h2>

    <!-- TOP HELP CONTENT -->
    <help-content #topHelperContent [position]="'top'"
                  [ngClass]="topHelperContent.isPresent()?'uk-margin-medium-top uk-margin-medium-bottom':'clear-style'">
    </help-content>

    <div class="uk-grid">

      <!-- LEFT HELP CONTENT -->
      <aside-help-content #leftHelperContent [position]="'left'"
                          [ngClass]="leftHelperContent.isPresent()?'tm-sidebar uk-width-1-4@m uk-first-column':'clear-style'">
      </aside-help-content>

      <!-- MIDDLE -->
      <div class=" uk-width-expand@m">

        <repository-tiles [parent]="'compatibilityMonitor'" [tilesView]="tilesView"></repository-tiles>

      </div>

      <!-- RIGHT HELP CONTENT -->
      <aside-help-content #rightHelperContent [position]="'right'"
                          [ngClass]="rightHelperContent.isPresent()?'tm-sidebar uk-width-1-4@m uk-first-column':'clear-style'">
      </aside-help-content>

    </div>

    <!-- BOTTOM HELP CONTENT -->
    <help-content #bottomHelperContent [position]="'bottom'"
                  [ngClass]="bottomHelperContent.isPresent()?'uk-margin-medium-top uk-margin-medium-bottom':'clear-style'">
    </help-content>

  </div>
</div>
